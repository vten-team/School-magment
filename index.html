<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6354d9" />
    <meta
      name="description"
      content="EduManage school workspace: students, classes, attendance, and school administration."
    />
    <title>Dashboard · EduManage</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%236354d9'/%3E%3Ctext x='11' y='29' fill='white' font-family='Arial' font-size='28' font-weight='bold'%3EE%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a class="brand" href="#dashboard"
          ><span class="brand-mark">E<span></span></span>edu<span class="brand-light">manage</span
          ><span class="brand-period">.</span></a
        >
        <div class="school-switcher">
          <span class="school-icon" data-icon="school"></span>
          <div>
            <strong id="schoolLabel">Greenfield Academy</strong
            ><small id="yearLabel">Academic year 2026/27</small>
          </div>
          <span class="school-check" data-icon="check"></span>
        </div>
        <nav id="navigation"></nav>
        <div class="sidebar-bottom">
          <div class="help-card">
            <span data-icon="sparkles"></span><strong>A little help goes a long way.</strong>
            <p>Your school, all in one place.</p>
            <button class="help-link" data-action="guide">
              Explore the quick guide <span data-icon="arrow-right"></span>
            </button>
          </div>
          <div class="sidebar-user">
            <span class="avatar admin-avatar">AS</span>
            <div><strong>Alex Sharma</strong><small>School administrator</small></div>
            <button
              class="icon-btn"
              data-nav="settings"
              aria-label="Open settings"
              data-icon="settings"
            ></button>
          </div>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-btn menu-toggle"
              data-action="menu"
              aria-label="Open navigation"
              aria-expanded="false"
              data-icon="menu"
            ></button
            ><span class="breadcrumb"
              ><span class="workspace-label">Workspace</span>
              <span class="breadcrumb-separator">/</span>
              <strong id="breadcrumb">Overview</strong></span
            >
          </div>
          <div class="topbar-actions">
            <label class="global-search"
              ><span data-icon="search"></span
              ><input
                id="globalSearch"
                type="search"
                placeholder="Search students..."
                aria-label="Search students"
              /><kbd>⌘ K</kbd></label
            ><span class="top-divider"></span
            ><button
              class="icon-btn notification-btn"
              data-action="notifications"
              aria-label="View upcoming events"
            >
              <span data-icon="bell"></span><i></i></button
            ><span class="avatar admin-avatar top-avatar">AS</span>
          </div>
        </header>
        <div id="storageWarning" class="storage-warning" role="alert" hidden></div>
        <section class="view" id="app" aria-label="School workspace"></section>
        <footer class="app-footer">
          <span>Made for better school days.</span
          ><span
            ><i></i> Local demo <span class="footer-separator">·</span> Data saved on this
            browser</span
          >
        </footer>
      </main>
    </div>
    <dialog id="recordDialog" aria-labelledby="dialogTitle"><div id="dialogContent"></div></dialog>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
